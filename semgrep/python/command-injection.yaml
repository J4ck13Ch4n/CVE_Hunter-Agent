rules:
  - id: py-subprocess-shell-true
    patterns:
      - pattern-either:
          - pattern: |
              subprocess.call($CMD, shell=True, ...)
          - pattern: |
              subprocess.run($CMD, shell=True, ...)
          - pattern: |
              subprocess.Popen($CMD, shell=True, ...)
          - pattern: |
              subprocess.check_output($CMD, shell=True, ...)
          - pattern: |
              subprocess.check_call($CMD, shell=True, ...)
      - pattern-not: |
          subprocess.call("...", shell=True, ...)
      - pattern-not: |
          subprocess.run("...", shell=True, ...)
    message: >
      subprocess with shell=True and dynamic command input.
      When shell=True, the command is passed to /bin/sh, enabling injection
      via shell metacharacters (;, |, $(), ``, &&). Use shell=False (default)
      with a list of arguments instead.
    languages: [python]
    severity: ERROR
    metadata:
      cwe:
        - "CWE-78: Improper Neutralization of Special Elements used in an OS Command"
      cvss: "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:H/I:H/A:H"
      confidence: HIGH
      impact: HIGH
      category: security
      references:
        - https://cwe.mitre.org/data/definitions/78.html

  - id: py-os-system-dynamic
    patterns:
      - pattern-either:
          - pattern: |
              os.system($CMD)
          - pattern: |
              os.popen($CMD)
          - pattern: |
              os.popen($CMD, ...)
      - pattern-not: |
          os.system("...")
      - pattern-not: |
          os.popen("...")
    message: >
      os.system() or os.popen() with dynamic input always uses a shell.
      These functions cannot be made safe with argument lists.
      Replace with subprocess.run() with shell=False and argument list.
    languages: [python]
    severity: ERROR
    metadata:
      cwe:
        - "CWE-78: Improper Neutralization of Special Elements used in an OS Command"
      confidence: HIGH
      impact: HIGH
      category: security

  - id: py-subprocess-format-string
    patterns:
      - pattern-either:
          - pattern: |
              subprocess.call(f"...{$VAR}...", shell=True, ...)
          - pattern: |
              subprocess.run(f"...{$VAR}...", shell=True, ...)
          - pattern: |
              subprocess.Popen(f"...{$VAR}...", shell=True, ...)
          - pattern: |
              subprocess.call("...".format($VAR), shell=True, ...)
          - pattern: |
              subprocess.run("...".format($VAR), shell=True, ...)
          - pattern: |
              subprocess.call("..." % $VAR, shell=True, ...)
          - pattern: |
              subprocess.run("..." % $VAR, shell=True, ...)
    message: >
      String formatting in subprocess command with shell=True.
      f-strings, .format(), and % formatting in shell commands enable injection.
      Use argument lists: subprocess.run(["cmd", arg1, arg2]) without shell=True.
    languages: [python]
    severity: ERROR
    metadata:
      cwe:
        - "CWE-78: Improper Neutralization of Special Elements used in an OS Command"
      confidence: HIGH
      impact: HIGH
      category: security
